version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinesync-backend-prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      AI_SERVICE_URL: http://ai-service:8000/api/v1
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dinesync-ai-prod
    restart: always

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinesync-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
