version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dinesync-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: dinesync
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinesync-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/dinesync
      JWT_SECRET: super-secret-production-jwt-key-dinesync-2026
      CLIENT_URL: http://localhost
      AI_SERVICE_URL: http://ai-service:8000/api/v1
    depends_on:
      - mongodb
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dinesync-ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5000}
      BACKEND_API_URL: http://backend:5000/api/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinesync-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo-data:
